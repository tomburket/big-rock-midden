<!DOCTYPE html>
<html lang="en">
<head>
<!--{{META}}-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Big Rock Midden &middot; {{TITLE_DATE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
--ink: #14130f;
--ink-mid: #2b2a24;
--ink-light: #4f4d45;
--ink-faint: #67655c;
--rule: #c9c6ba;
--rule-soft: #e6e3da;
--accent: #2f4739;
--accent-deep: #1d2e24;
--bg: #f4f3ee;
--card: #ffffff;
--tag-field: #dfe4ee;      --tag-field-text: #2a3d63;
--tag-enforce: #eddfdc;    --tag-enforce-text: #6e2b22;
--tag-risk: #efe6d3;       --tag-risk-text: #6b4a12;
--tag-industry: #d8e6e3;   --tag-industry-text: #1c4a44;
--tag-academy: #e5dcea;    --tag-academy-text: #4a2c5c;
--tag-cache: #e0e6d5;      --tag-cache-text: #3d4a22;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: var(--bg);
color: var(--ink);
font-family: 'Spectral', Georgia, serif;
font-weight: 400;
line-height: 1.65;
-webkit-font-smoothing: antialiased;
}

/* ============================ masthead ============================ */

.masthead {
background: var(--accent-deep);
color: #f4f3ec;
padding: 34px 22px 26px;
border-bottom: 3px solid var(--accent);
}

.masthead-inner { max-width: 47rem; margin: 0 auto; }

.masthead-date {
font-family: 'IBM Plex Sans', sans-serif;
font-size: 12.5px;
font-weight: 500;
letter-spacing: 0.13em;
text-transform: uppercase;
color: #c6d8c9;
padding-bottom: 12px;
border-bottom: 1px solid rgba(157,179,164,0.28);
margin-bottom: 16px;
}

.masthead-title {
font-family: 'Spectral', Georgia, serif;
font-weight: 400;
font-size: 38px;
line-height: 1.1;
letter-spacing: -0.008em;
color: #fbfaf5;
}

.masthead-rule {
margin: 14px 0 12px;
height: 0;
border-top: 1px solid rgba(157,179,164,0.42);
border-bottom: 3px double rgba(157,179,164,0.22);
padding-bottom: 3px;
}

.masthead-meta {
font-family: 'IBM Plex Sans', sans-serif;
font-size: 14.5px;
font-weight: 400;
color: #cfdfd1;
line-height: 1.5;
}

/* ========================= summary strip ========================== */

.summary-strip {
background: #26382d;
padding: 15px 22px;
display: flex;
flex-wrap: wrap;
gap: 26px;
justify-content: center;
}

.summary-pill { text-align: center; min-width: 62px; }

.summary-pill-num {
font-family: 'Spectral', Georgia, serif;
font-size: 26px;
font-weight: 400;
color: #f4f7ef;
line-height: 1.1;
}

.summary-pill-label {
font-family: 'IBM Plex Sans', sans-serif;
font-size: 11px;
font-weight: 500;
letter-spacing: 0.09em;
text-transform: uppercase;
color: #c0d3c3;
margin-top: 3px;
line-height: 1.32;
}

/* ============================== nav =============================== */

.section-nav {
background: var(--card);
border-bottom: 1px solid var(--rule);
padding: 13px 22px;
display: flex;
flex-wrap: wrap;
gap: 6px 20px;
justify-content: center;
font-family: 'IBM Plex Sans', sans-serif;
font-size: 13.5px;
font-weight: 500;
letter-spacing: 0.04em;
}

.section-nav a {
color: var(--ink-light);
text-decoration: none;
border-bottom: 1px solid transparent;
padding-bottom: 2px;
transition: color 0.14s, border-color 0.14s;
}

.section-nav a:hover { color: var(--accent); border-bottom-color: var(--accent); }

/* ============================ content ============================= */

.content { max-width: 47rem; margin: 0 auto; padding: 40px 22px 60px; }

section { margin-bottom: 50px; }

.section-header { display: flex; align-items: baseline; gap: 13px; }

.section-number {
font-family: 'IBM Plex Sans', sans-serif;
font-size: 12.5px;
font-weight: 600;
letter-spacing: 0.09em;
color: var(--ink-faint);
}

.section-title {
font-family: 'Spectral', Georgia, serif;
font-size: 24px;
font-weight: 400;
letter-spacing: 0.004em;
color: var(--accent-deep);
}

/* stratification: three rules of decreasing weight, like a section cut */
.section-rule {
border: 0;
height: 0;
margin: 9px 0 26px;
border-top: 2px solid var(--accent);
border-bottom: 1px solid var(--rule);
padding-bottom: 3px;
position: relative;
}

.section-rule::after {
content: "";
position: absolute;
left: 0; right: 0; top: 7px;
border-top: 1px solid var(--rule-soft);
}

/* ============================= cards ============================== */

.item-card {
background: var(--card);
border: 1px solid var(--rule);
border-left: 3px solid var(--accent);
padding: 23px 22px 20px;
margin-bottom: 22px;
}

.item-header { margin-bottom: 11px; }

.item-tag {
display: inline-block;
font-family: 'IBM Plex Sans', sans-serif;
font-size: 11px;
font-weight: 600;
letter-spacing: 0.1em;
text-transform: uppercase;
padding: 4px 10px;
margin-bottom: 10px;
background: var(--tag-field);
color: var(--tag-field-text);
}

.tag-field    { background: var(--tag-field);    color: var(--tag-field-text); }
.tag-enforce  { background: var(--tag-enforce);  color: var(--tag-enforce-text); }
.tag-risk     { background: var(--tag-risk);     color: var(--tag-risk-text); }
.tag-industry { background: var(--tag-industry); color: var(--tag-industry-text); }
.tag-academy  { background: var(--tag-academy);  color: var(--tag-academy-text); }
.tag-cache    { background: var(--tag-cache);    color: var(--tag-cache-text); }

.item-headline {
font-family: 'Spectral', Georgia, serif;
font-size: 23px;
font-weight: 600;
line-height: 1.3;
letter-spacing: -0.004em;
color: var(--ink);
}

.item-source {
font-family: 'IBM Plex Sans', sans-serif;
font-size: 13.5px;
font-weight: 400;
color: var(--ink-faint);
letter-spacing: 0.02em;
margin-bottom: 13px;
padding-bottom: 11px;
border-bottom: 1px solid var(--rule-soft);
}

.item-summary { font-size: 19px; line-height: 1.68; color: var(--ink-mid); }

.item-summary i, .item-summary em,
.implication-text i, .implication-text em { font-style: italic; }

.implication-block {
margin-top: 17px;
padding: 15px 17px;
background: #f1f2ec;
border-left: 2px solid var(--accent);
}

.implication-label {
font-family: 'IBM Plex Sans', sans-serif;
font-size: 11.5px;
font-weight: 600;
letter-spacing: 0.12em;
text-transform: uppercase;
color: var(--accent);
margin-bottom: 6px;
}

.implication-text { font-size: 18px; line-height: 1.62; color: var(--ink-mid); }

.item-link {
display: inline-block;
margin-top: 15px;
font-family: 'IBM Plex Sans', sans-serif;
font-size: 14px;
font-weight: 500;
letter-spacing: 0.02em;
color: var(--accent);
text-decoration: none;
border-bottom: 1px solid var(--rule);
padding-bottom: 1px;
transition: border-color 0.14s;
}

.item-link:hover { border-bottom-color: var(--accent); }

.back-to-top {
display: block;
text-align: center;
font-family: 'IBM Plex Sans', sans-serif;
font-size: 13.5px;
letter-spacing: 0.04em;
color: var(--ink-faint);
text-decoration: none;
margin-top: 34px;
}

.back-to-top:hover { color: var(--accent); }

/* ============================= footer ============================= */

.footer {
background: var(--accent-deep);
color: #cfdfd1;
padding: 30px 22px 34px;
text-align: center;
font-family: 'IBM Plex Sans', sans-serif;
font-size: 14px;
line-height: 1.72;
}

.footer strong {
font-family: 'Spectral', Georgia, serif;
font-weight: 400;
font-size: 18px;
color: #f4f3ec;
letter-spacing: 0.008em;
}

.footer-gloss {
max-width: 30rem;
margin: 11px auto 14px;
font-family: 'Spectral', Georgia, serif;
font-style: italic;
font-weight: 400;
font-size: 16.5px;
line-height: 1.55;
letter-spacing: 0.01em;
color: #c6d8c9;
}

.footer a { color: #c3d4c6; text-decoration: none; border-bottom: 1px solid rgba(195,212,198,0.3); }
.footer a:hover { border-bottom-color: #c3d4c6; }

/* Small screens: the summary strip duplicates the masthead's entry count and
   topic list verbatim, and at legible type it costs a full screen before the
   first card. Drop it and tighten the nav so card one lands above the fold. */
@media (max-width: 639px) {
.summary-strip { display: none; }
.section-nav {
padding: 11px 16px;
gap: 3px 16px;
font-size: 13px;
justify-content: flex-start;
}
.masthead { padding: 26px 22px 22px; }
.masthead-title { font-size: 34px; }
.content { padding: 28px 20px 52px; }
.item-card { padding: 21px 19px 19px; }
.item-headline { font-size: 21px; }
section { margin-bottom: 40px; }
}

@media (min-width: 640px) {
.masthead { padding: 46px 32px 34px; }
.masthead-title { font-size: 52px; }
.content { padding: 54px 30px 76px; }
.item-card { padding: 32px 34px 28px; }
.item-headline { font-size: 26px; }
.item-summary { font-size: 20px; }
.implication-text { font-size: 19px; }
.section-title { font-size: 27px; }
.masthead-meta { font-size: 15.5px; }
}
</style>
</head>
<body>

<header class="masthead">
<div class="masthead-inner">
<div class="masthead-date">{{MAST_DATE}} &middot; Edition No. {{ED_NO}}</div>
<div class="masthead-title">Big Rock Midden</div>
<div class="masthead-rule"></div>
<div class="masthead-meta">{{N_ITEMS}} entries &middot; {{TOPICS}}</div>
</div>
</header>

<div class="summary-strip" aria-label="Coverage summary">
{{PILLS}}
</div>

<nav class="section-nav">
{{NAV}}
</nav>

<main class="content">

{{SECTIONS}}

<a class="back-to-top" href="#">Return to top &uarr;</a>
</main>

<footer class="footer">
<strong>Big Rock Midden</strong><br>
<div class="footer-gloss">Sifter, sorter, saver of big rocks.</div>
Prepared by Tom Burket &middot; word/cairn<br>
{{FOOT_DATE}} &middot; Edition No. {{ED_NO}}
<br><br><a href="/editions/">Past editions &rarr;</a>
</footer>

</body>
</html>
